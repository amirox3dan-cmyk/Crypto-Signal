    <title>CryptoSignal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dark: {
                900: '#000000',
                800: '#0a0a0a',
                700: '#141414',
              },
              brand: {
                500: '#D90429', // Vivid Red
                400: '#EF233C', // Lighter Red
              },
              success: '#10b981',
              danger: '#ef4444',
            },
            fontFamily: {
              sans: ['Vazirmatn', 'system-ui', 'sans-serif'],
            },
            animation: {
              'wiggle': 'wiggle 1s ease-in-out infinite',

            keyframes: {
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },

              }
            }
          },
        },
      };

      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #2d2d42;
